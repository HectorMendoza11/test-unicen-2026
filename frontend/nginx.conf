# Sirve la aplicación React compilada y redirige /api al contenedor de la API.
# Así el navegador usa un solo origen (sin problemas de CORS) y la URL de la API no se fija al compilar.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy hacia la API: "api" es el nombre del servicio en docker-compose.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA: cualquier ruta desconocida devuelve index.html y React Router decide qué mostrar.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
