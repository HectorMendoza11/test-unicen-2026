services:
  db:
    image: postgres:16-alpine
    container_name: unicen-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unicen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unicen}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_academico}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unicen} -d ${POSTGRES_DB:-sistema_academico}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: unicen-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-unicen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unicen}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_academico}
      API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-cambiar_este_secreto}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
